services:
  web-application:
    container_name: web-application-container
    depends_on:
      - db
    build: ../web-aplication
    ports:
      - "3333:3333"
    environment:
      DB_HOST: db
      DB_DATABASE: tech_music
      DB_USER: root
      DB_PASSWORD: p0o9i8u7
      DB_PORT: 3306
      APP_PORT: 3333
      APP_HOST: localhost

  db:
    container_name: database-container
    build: ../database
    environment:
      MYSQL_ROOT_PASSWORD: p0o9i8u7
      MYSQL_DATABASE: tech_music
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pp0o9i8u7"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jar:
    container_name: jar-container
    depends_on:
      db:
        condition: service_healthy
    build: ../java-application/leitura-dados
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tech_music
      DB_USER: root
      DB_PASSWORD: p0o9i8u7
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      # AWS_REGION: ${AWS_REGION:-us-east-1}

  nginx-proxy:
    container_name: nginx-proxy-container
    build: ../nginx-proxy
    ports:
      - "80:80"
      - "443:443"

volumes:
  db_data:

#docker-compose up --build -d para funcionar